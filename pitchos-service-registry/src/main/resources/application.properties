# ====================================================================
# PITCHOS SERVICE REGISTRY (EUREKA SERVER) - Cong 8761 - HOANG PHU TRACH
# ====================================================================

server.port=${REGISTRY_PORT:8761}
spring.application.name=pitchos-service-registry

# --------------------------------------------------------------------
# Eureka Server khong tu dang ky chinh no va khong keo ban sao registry
# tu node khac, vi he thong chi chay mot node Registry duy nhat (standalone).
# Neu de mac dinh (true), log se bao loi ket noi lien tuc khi khoi dong.
# --------------------------------------------------------------------
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Tat che do tu bao ve: o moi truong hoc tap chi co vai instance, Eureka de
# nham tuong mang loi hang loat va giu lai cac instance da chet trong danh ba,
# khien kich ban kiem thu "dung mot Provider" khong phan anh dung thuc te.
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000

# --------------------------------------------------------------------
# Actuator: chi mo health va info de phuc vu Docker healthcheck.
# Khong mo toan bo endpoint (/actuator/env, /actuator/beans...) vi se
# lo cau hinh noi bo ra ngoai.
# --------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Ghi log muc INFO cho goi Eureka de minh chung qua trinh dang ky khi demo
logging.level.com.netflix.eureka=INFO
logging.level.com.netflix.discovery=INFO
