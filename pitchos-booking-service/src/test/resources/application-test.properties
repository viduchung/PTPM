# ====================================================================
# Cấu hình chạy bộ test tích hợp IT01-IT07 (KT2 - Nhật)
# Chạy hoàn toàn cục bộ: H2 in-memory, không cần MySQL, Eureka hay Pitch Service thật.
# PitchClient được thay bằng mock để mô phỏng đủ các kịch bản phản hồi của Provider.
# ====================================================================
spring.datasource.url=jdbc:h2:mem:booking_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Không đăng ký / tra cứu Eureka khi chạy test
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

