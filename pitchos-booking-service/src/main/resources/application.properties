# ====================================================================
# MICROSERVICE 3: BOOKING SERVICE (Port 8083) - NHẬT PHỤ TRÁCH
# Cấu hình tự động kết nối và nạp từ file .env tổng
# ====================================================================

# Cổng khởi chạy dịch vụ
server.port=${BOOKING_SERVICE_PORT:8083}
spring.application.name=pitchos-booking-service

# Cấu hình Datasource MySQL (Đọc từ .env tổng)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${BOOKING_DB_NAME:pitchos_booking_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}

# Cấu hình Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cấu hình Giao tiếp OpenFeign gọi sang Pitch Service (Đọc từ .env tổng)
pitch.service.url=${PITCH_SERVICE_URL:http://localhost:8082}

# Cấu hình Bảo mật JWT (Đồng bộ secret key từ .env tổng để xác thực token)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
