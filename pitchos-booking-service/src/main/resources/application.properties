# ====================================================================
# MICROSERVICE 3: BOOKING SERVICE (Port 8083) - NHẬT PHỤ TRÁCH
# Vai trò: CONSUMER - gọi sang Provider pitchos-pitch-service qua Service ID
# Cấu hình tự động nạp từ biến môi trường (.env tổng / docker-compose)
# ====================================================================

# Cổng khởi chạy dịch vụ
server.port=${BOOKING_SERVICE_PORT:8083}
spring.application.name=pitchos-booking-service

# Cấu hình Datasource MySQL (Đọc từ .env tổng)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${BOOKING_DB_NAME:pitchos_booking_db}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}

# Cấu hình Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ====================================================================
# KT2 - SERVICE DISCOVERY (EUREKA CLIENT)
# Không còn khai báo PITCH_SERVICE_URL: Consumer tra cứu Provider trong
# danh bạ Eureka theo Service ID "pitchos-pitch-service".
# Trong Docker phải đặt EUREKA_URL=http://pitchos-service-registry:8761/eureka/
# (dùng localhost bên trong container sẽ trỏ về chính container đó).
# ====================================================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${INSTANCE_ID:${server.port}}

# ====================================================================
# KT2 - OPENFEIGN GỌI THEO SERVICE ID
# Timeout khai báo theo đúng Service ID của Provider (chống Cascading Failure):
# quá thời gian chờ → RetryableException → GlobalExceptionHandler trả 503.
# ====================================================================
spring.cloud.openfeign.client.config.pitchos-pitch-service.connect-timeout=2000
spring.cloud.openfeign.client.config.pitchos-pitch-service.read-timeout=3000

# ====================================================================
# KT2 - GIÁM SÁT (SPRING BOOT ACTUATOR)
# Chỉ mở health/info; show-details=never để không lộ chi tiết hạ tầng ra ngoài.
# ====================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Cấu hình Bảo mật JWT (Đồng bộ secret key từ .env tổng để xác thực token)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
