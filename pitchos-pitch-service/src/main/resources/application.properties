# ====================================================================
# MICROSERVICE 2: PITCH SERVICE (Port 8082) - LINH PHỤ TRÁCH
# Cấu hình tự động kết nối và nạp từ file .env tổng
# ====================================================================

# Cổng khởi chạy dịch vụ
server.port=${PITCH_SERVICE_PORT:8082}
spring.application.name=pitchos-pitch-service

# Cấu hình Datasource MySQL (Đọc từ .env tổng)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${PITCH_DB_NAME:pitchos_pitch_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}

# Cấu hình Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cấu hình Bảo mật JWT (Đồng bộ secret key từ .env tổng để giải mã token)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Cấu hình Swagger / OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
