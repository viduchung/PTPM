# ====================================================================
# MICROSERVICE 2: PITCH SERVICE (Port 8082 / 8084) - LINH PHỤ TRÁCH
# Cấu hình tự động kết nối và nạp từ biến môi trường Docker / .env
# ====================================================================

# Cổng khởi chạy dịch vụ (hỗ trợ SERVER_PORT hoặc PITCH_SERVICE_PORT, mặc định 8082)
server.port=${SERVER_PORT:${PITCH_SERVICE_PORT:8082}}
spring.application.name=pitchos-pitch-service

# Định danh instance phục vụ (dùng khi chạy nhiều instance để load balancing)
pitchos.instance-id=${INSTANCE_ID:pitch-default}

# ====================================================================
# CẤU HÌNH SERVICE REGISTRY & DISCOVERY (NETFLIX EUREKA CLIENT)
# ====================================================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${INSTANCE_ID:${server.port}}

# ====================================================================
# CẤU HÌNH SPRING BOOT ACTUATOR (HEALTHCHECK & GIÁM SÁT)
# ====================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ====================================================================
# CẤU HÌNH DATASOURCE MYSQL
# ====================================================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${PITCH_DB_NAME:pitchos_pitch_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}

# ====================================================================
# CẤU HÌNH SPRING DATA JPA / HIBERNATE
# ====================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ====================================================================
# CẤU HÌNH BẢO MẬT JWT (Đồng bộ secret key từ .env tổng)
# ====================================================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# ====================================================================
# CẤU HÌNH SWAGGER / OPENAPI DOCUMENTATION
# ====================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
