# ====================================================================
# MICROSERVICE 2: PITCH SERVICE (Port 8082) - PROFILE H2 IN-MEMORY
# Chạy dự phòng khi không có MySQL: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ====================================================================

server.port=8082
spring.application.name=pitchos-pitch-service

# Cấu hình H2 In-Memory tương thích MySQL
spring.datasource.url=jdbc:h2:mem:pitchos_pitch_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Secret dùng chung
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
