version: '3.8'

# ====================================================================
# PITCHOS - HỆ THỐNG ĐẶT SÂN BÓNG TRỰC TUYẾN (SOA / MICROSERVICES 2026)
# ĐIỀU PHỐI CONTAINER TOÀN HỆ THỐNG BẰNG DOCKER COMPOSE (TX2 - LINH PHỤ TRÁCH)
#
# Kiến trúc triển khai 8 container (4 Java Microservices, 1 Registry, 3 MySQL DB):
#   1. pitchos-service-registry : Eureka Server (Cổng 8761)
#   2. pitchos-auth-service     : Xác thực & Quản lý User (Cổng 8081)
#   3. pitchos-pitch-service-1  : Quản lý sân bóng - Instance 1 (Cổng 8082, INSTANCE_ID=pitch-instance-1)
#   4. pitchos-pitch-service-2  : Quản lý sân bóng - Instance 2 (Cổng 8084, INSTANCE_ID=pitch-instance-2)
#   5. pitchos-booking-service  : Đặt sân bóng (Cổng 8083, Consumer)
#   6. mysql-auth               : CSDL riêng cho Auth Service (Named Volume: mysql_auth_data)
#   7. mysql-pitch              : CSDL dùng chung cho 2 instance Pitch (Named Volume: mysql_pitch_data)
#   8. mysql-booking            : CSDL riêng cho Booking Service (Named Volume: mysql_booking_data)
#
# Toàn bộ giao tiếp qua mạng nội bộ: pitchos-network (tuyệt đối không dùng localhost)
# ====================================================================

services:

  # ==================================================================
  # TẦNG 1: CƠ SỞ DỮ LIỆU ĐỘC LẬP (DATABASE-PER-SERVICE - HÙNG & LINH)
  # ==================================================================

  # 1.1. CSDL MySQL cho Auth & User Service
  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${AUTH_DB_NAME:-pitchos_user_db}
    ports:
      - "${MYSQL_AUTH_PORT:-3307}:3306"
    volumes:
<<<<<<< Updated upstream
      - mysql_data:/var/lib/mysql
      # Tự động nạp 3 file SQL của Hùng khi khởi động container lần đầu:
      - ./pitchos-database/auth-user-service.sql:/docker-entrypoint-initdb.d/01_auth.sql
      - ./pitchos-database/pitch-service.sql:/docker-entrypoint-initdb.d/02_pitch.sql
      - ./pitchos-database/booking-service.sql:/docker-entrypoint-initdb.d/03_booking.sql
