# ====================================================================
# MICROSERVICE 1: AUTH & USER SERVICE (Port 8081) - HOÀNG PHỤ TRÁCH
# Cấu hình tự động kết nối và nạp từ file .env tổng
# ====================================================================

# Cổng khởi chạy dịch vụ
server.port=${AUTH_SERVICE_PORT:8081}
spring.application.name=pitchos-auth-service

# Cấu hình Datasource MySQL (Đọc từ .env tổng)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${AUTH_DB_NAME:pitchos_user_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}

# Cấu hình Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cấu hình Bảo mật JWT Dùng chung (Đọc từ .env tổng)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Cấu hình Swagger / OpenAPI Documentation (giữ đúng path như Pitch Service)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ====================================================================
# EUREKA CLIENT - Tu dang ky vao Service Registry (Hoang bo sung o KT2)
# ====================================================================
# Dia chi Eureka Server. Mac dinh localhost:8761 de chay tren may that;
# khi chay bang Docker Compose, bien EUREKA_URL se tro vao ten
# service trong mang noi bo: http://pitchos-service-registry:8761/eureka/
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Dang ky bang dia chi IP thay vi hostname. Trong Docker, hostname cua
# container la ma hash ngau nhien, cac service khac khong phan giai duoc.
eureka.instance.prefer-ip-address=true

# Instance ID co kem port de phan biet nhieu instance cua cung mot service
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Nhip Heartbeat: 10 giay gui mot lan, sau 30 giay khong thay thi bi loai khoi
# danh ba. Mac dinh cua Eureka la 30/90 giay - qua cham cho kich ban demo
# "dung mot Provider roi quan sat".
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ====================================================================
# SPRING BOOT ACTUATOR - Theo doi suc khoe ung dung
# ====================================================================
# Chi mo health va info. Khong mo toan bo endpoint vi /actuator/env se
# phoi bay chuoi ket noi CSDL va JWT_SECRET ra ngoai.
management.endpoints.web.exposure.include=health,info
# show-details=never: chi tra ve {"status":"UP"}, khong ke chi tiet thanh phan
# ben trong (ten database, dung luong o dia) cho nguoi goi ben ngoai.
management.endpoint.health.show-details=never
