# ====================================================================
# MICROSERVICE 1: AUTH & USER SERVICE (Port 8081) - LINH PHỤ TRÁCH
# Cấu hình tự động kết nối và nạp từ file .env tổng
# ====================================================================

# Cổng khởi chạy dịch vụ
server.port=${AUTH_SERVICE_PORT:8081}
spring.application.name=pitchos-auth-service

# Cấu hình Datasource MySQL (Đọc từ .env tổng)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${AUTH_DB_NAME:pitchos_user_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}

# Cấu hình Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cấu hình Bảo mật JWT Dùng chung (Đọc từ .env tổng)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
